<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Somos</title>
  <meta name="theme-color" content="#0d0b12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
</head>
<body>

<!-- ── LOADING ── -->
<div id="loading">
  <div class="load-inner">
    <div class="load-heart">🌿</div>
    <div class="load-title">Somos</div>
    <div class="load-bar"><div class="load-bar-fill"></div></div>
  </div>
</div>

<!-- ── AUTH ── -->
<div id="auth-screen" class="hidden">
  <div class="auth-bg">
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
  </div>
  <div class="auth-card">
    <div class="auth-emoji">🌿</div>
    <h1 class="auth-title">Somos</h1>
    <p class="auth-sub">Nuestro espacio 🌿</p>
    <button id="google-signin-btn" class="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 002.38-5.88c0-.57-.05-.66-.15-1.18z"/>
        <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 01-7.18-2.54H1.83v2.07A8 8 0 008.98 17z"/>
        <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 010-3.04V5.41H1.83a8 8 0 000 7.18l2.67-2.07z"/>
        <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 001.83 5.4L4.5 7.49a4.77 4.77 0 014.48-3.31z"/>
      </svg>
      Entrar con Google
    </button>
    <p class="auth-note">Solo Juan y Greisi</p>
  </div>
</div>

<!-- ── APP ── -->
<div id="app" class="hidden">

  <!-- TOP HEADER -->
  <header id="topbar">
    <div class="topbar-left">
      <button class="menu-btn" id="menu-btn">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar-title" id="topbar-period"></div>
    </div>
    <div class="topbar-right">
      <!-- VIEW SWITCHER -->
      <div id="view-switcher-wrap" class="vsw-wrap">
        <button class="vsw-btn active" data-view="week">Sem</button>
        <button class="vsw-btn" data-view="month">Mes</button>
        <button class="vsw-btn" data-view="year">Año</button>
      </div>
      <button class="icon-btn" id="notif-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="notif-dot hidden" id="notif-dot"></span>
      </button>
      <div id="user-avatar-top"></div>
    </div>
  </header>

  <!-- SLIDE MENU -->
  <div id="menu-overlay" class="hidden"></div>
  <aside id="slide-menu" class="closed">
    <div class="menu-user">
      <div id="menu-avatar"></div>
      <div class="menu-user-info">
        <div id="menu-name" class="menu-name"></div>
        <div id="menu-email" class="menu-email"></div>
      </div>
    </div>

    <nav class="menu-nav">
      <button class="menu-item active" data-section="together">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Juntos
      </button>
      <button class="menu-item" data-section="my-schedule">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Mi horario
      </button>
      <button class="menu-item" data-section="events">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Planes y citas
      </button>
      <button class="menu-item" data-section="notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Notificaciones
        <span class="menu-badge hidden" id="menu-notif-badge">0</span>
      </button>
    </nav>

    <div class="menu-footer">
      <button class="menu-signout" id="signout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="main-content">

    <!-- ── SECCIÓN: JUNTOS ── -->
    <section id="section-together" class="section active">
      <div class="cal-controls">
        <div class="week-nav">
          <button class="week-nav-btn" id="together-prev">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="week-nav-label" id="together-week-label"></div>
          <button class="week-nav-btn" id="together-next">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="today-chip" id="together-today">Hoy</button>
        </div>
        <div class="legend-bar">
          <div class="legend-item juan-color"><span class="dot"></span>Juan</div>
          <div class="legend-item greisi-color"><span class="dot"></span>Greisi</div>
          <div class="legend-item free-color"><span class="dot"></span>Libres</div>
        </div>
      </div>
      <div class="cal-body">
        <div id="together-grid"></div>
      </div>
    </section>

    <!-- ── SECCIÓN: MI HORARIO ── -->
    <section id="section-my-schedule" class="section hidden">
      <div class="cal-controls">
        <div class="week-nav">
          <button class="week-nav-btn" id="my-prev">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div class="week-nav-label" id="my-week-label"></div>
          <button class="week-nav-btn" id="my-next">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
          <button class="today-chip" id="my-today">Hoy</button>
        </div>
        <div class="section-header" style="padding:0 16px 8px">
          <h2 class="section-title">Mi horario</h2>
          <button class="fab-inline" id="add-block-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Agregar
          </button>
        </div>
      </div>
      <div class="cal-body">
        <div id="my-grid"></div>
      </div>
    </section>

    <!-- ── SECCIÓN: EVENTOS ── -->
    <section id="section-events" class="section hidden">
      <div class="section-header">
        <h2 class="section-title">Planes y citas</h2>
        <button class="fab-inline" id="add-event-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Nuevo
        </button>
      </div>
      <div id="events-list"></div>
    </section>

    <!-- ── SECCIÓN: NOTIFICACIONES ── -->
    <section id="section-notifications" class="section hidden">
      <div class="section-header">
        <h2 class="section-title">Notificaciones</h2>
        <button class="text-btn" id="clear-notifs-btn">Limpiar</button>
      </div>
      <div id="notifs-list"></div>
    </section>

  </main>

  <button class="fab" id="fab-add" title="Agregar bloque">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

</div><!-- #app -->

<!-- ── MODAL: BLOQUE ── -->
<div class="modal-overlay hidden" id="block-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <h3 id="block-modal-title">Agregar bloque</h3>
      <button class="modal-x" id="close-block-modal">✕</button>
    </div>
    <div class="field-group">
      <label class="field-label">Nombre *</label>
      <input type="text" class="field-input" id="block-title" placeholder="Ej: Cálculo II, Trabajo, Gimnasio…">
    </div>
    <div class="field-group">
      <label class="field-label">Tipo</label>
      <div class="chip-row" id="block-type-chips">
        <button class="type-chip selected" data-val="university">Universidad</button>
        <button class="type-chip" data-val="work">Trabajo</button>
        <button class="type-chip" data-val="activity">Actividad</button>
        <button class="type-chip" data-val="other">Otro</button>
      </div>
    </div>
    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Inicio</label>
        <input type="time" class="field-input" id="block-start" value="07:00">
      </div>
      <div class="field-group">
        <label class="field-label">Fin</label>
        <input type="time" class="field-input" id="block-end" value="09:00">
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Días de la semana</label>
      <div class="day-chips" id="block-days">
        <button class="day-chip" data-day="1">Lu</button>
        <button class="day-chip" data-day="2">Ma</button>
        <button class="day-chip" data-day="3">Mi</button>
        <button class="day-chip" data-day="4">Ju</button>
        <button class="day-chip" data-day="5">Vi</button>
        <button class="day-chip" data-day="6">Sá</button>
        <button class="day-chip" data-day="0">Do</button>
      </div>
    </div>
    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Desde</label>
        <input type="date" class="field-input" id="block-from">
      </div>
      <div class="field-group">
        <label class="field-label">Hasta</label>
        <input type="date" class="field-input" id="block-to">
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Notas (opcional)</label>
      <input type="text" class="field-input" id="block-notes" placeholder="Salón, dirección…">
    </div>
    <div class="modal-actions">
      <button class="btn-danger-ghost hidden" id="block-delete-btn">Eliminar</button>
      <button class="btn-primary" id="block-save-btn">Guardar</button>
    </div>
  </div>
</div>

<!-- ── MODAL: EVENTO ── -->
<div class="modal-overlay hidden" id="event-modal">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-head">
      <h3 id="event-modal-title">Nuevo plan</h3>
      <button class="modal-x" id="close-event-modal">✕</button>
    </div>
    <div class="field-group">
      <label class="field-label">Título *</label>
      <input type="text" class="field-input" id="ev-title" placeholder="¿Qué van a hacer?">
    </div>
    <div class="field-group">
      <label class="field-label">Tipo</label>
      <div class="chip-row" id="ev-type-chips">
        <button class="type-chip selected" data-val="date">Cita 🌿</button>
        <button class="type-chip" data-val="shared">Compartido</button>
        <button class="type-chip" data-val="personal">Personal</button>
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Fecha</label>
      <input type="date" class="field-input" id="ev-date">
    </div>
    <div class="field-row">
      <div class="field-group">
        <label class="field-label">Inicio</label>
        <input type="time" class="field-input" id="ev-start">
      </div>
      <div class="field-group">
        <label class="field-label">Fin</label>
        <input type="time" class="field-input" id="ev-end">
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">
        <input type="checkbox" id="ev-allday" style="accent-color:var(--accent)"> Todo el día
      </label>
    </div>
    <div class="field-group">
      <label class="field-label">Notas</label>
      <textarea class="field-input" id="ev-desc" rows="2" placeholder="Lugar, detalles…" style="resize:vertical"></textarea>
    </div>
    <div class="field-group">
      <label class="field-label">
        <input type="checkbox" id="ev-notify" checked style="accent-color:var(--accent)"> Notificar a mi pareja
      </label>
    </div>
    <div class="modal-actions">
      <button class="btn-danger-ghost hidden" id="ev-delete-btn">Eliminar</button>
      <button class="btn-primary" id="ev-save-btn">Guardar</button>
    </div>
  </div>
</div>

<!-- ── TOAST ── -->
<div id="toast-wrap"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
